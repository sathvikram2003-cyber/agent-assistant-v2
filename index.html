<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techsoul Assist | Advanced AI QA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050507;
            --glass-surface: rgba(24, 24, 28, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --accent: #3b82f6; /* Brilliant Blue */
            --accent-glow: rgba(59, 130, 246, 0.4);
            
            --success: #10b981; /* Emerald */
            --success-glow: rgba(16, 185, 129, 0.3);
            
            --danger: #ef4444; /* Crimson */
            --danger-glow: rgba(239, 68, 68, 0.2);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --keyword-bg: rgba(59, 130, 246, 0.2);
            
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .app-workspace { width: 100%; max-width: 1800px; height: 96vh; display: flex; gap: 24px; padding: 24px; }

        .glass-panel {
            background: var(--glass-surface); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* ================= LEFT PANEL ================= */
        .panel-left { width: 340px; padding: 24px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .brand-logo svg { width: 34px; height: 34px; fill: none; stroke: var(--accent); stroke-width: 2.5; filter: drop-shadow(0 0 10px var(--accent-glow)); }

        .ai-status-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
            padding: 20px; text-align: center; position: relative; overflow: hidden;
        }
        .pulse-ring { position: absolute; top: 15px; left: 15px; width: 12px; height: 12px; border-radius: 50%; background: #475569; }
        .pulse-ring.active { background: var(--success); box-shadow: 0 0 15px var(--success); animation: pulse 1s infinite; }
        
        .btn {
            width: 100%; padding: 16px; border-radius: var(--radius-md); border: 1px solid transparent;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-ai { background: var(--accent); color: #fff; box-shadow: 0 8px 20px var(--accent-glow); }
        .btn-ai:hover { transform: translateY(-2px); box-shadow: 0 12px 25px var(--accent-glow); }
        .btn-ai.listening { background: var(--danger); box-shadow: 0 8px 20px var(--danger-glow); }

        .live-transcript {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: var(--radius-md);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .transcript-head { padding: 12px; background: rgba(255,255,255,0.03); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--glass-border); }
        .transcript-body { padding: 16px; flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.6; }
        .txt-final { color: #fff; }
        .txt-interim { color: var(--text-muted); font-style: italic; }

        /* ================= MIDDLE PANEL (SCRIPT) ================= */
        .panel-middle { flex: 1; position: relative; }
        
        .script-header {
            padding: 24px 32px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        
        select.modern-select {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            padding: 10px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; outline: none; cursor: pointer;
        }
        select.modern-select:hover { background: rgba(255,255,255,0.1); }
        select.modern-select option { background: var(--bg-deep); }

        .script-container { padding: 32px; overflow-y: auto; height: calc(100% - 80px); scroll-behavior: smooth; }

        .script-card {
            padding: 24px; margin-bottom: 24px; border-radius: var(--radius-lg);
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-left: 4px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .script-card.active {
            background: rgba(59, 130, 246, 0.05); border-color: var(--accent); border-left: 4px solid var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); transform: scale(1.01);
        }
        .script-card.done { border-left-color: var(--success); opacity: 0.6; }
        .script-card.missed { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.3); }

        .step-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between;}
        .script-card.active .step-title { color: var(--accent); }
        .script-card.done .step-title { color: var(--success); text-decoration: line-through; }
        .script-card.missed .step-title { color: var(--danger); }
        .script-card.missed .step-title::after { content: 'MISSED STEP'; background: var(--danger); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; }

        .step-text { font-size: 16px; line-height: 1.7; color: var(--text-main); }
        .kw { font-weight: 600; color: #fff; background: var(--keyword-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.3); }

        /* Dynamic PA Pitch Pop-Up UI (Appears AFTER reading) */
        .pa-decision-ui {
            margin-top: 20px; padding: 20px; border-radius: var(--radius-md); background: rgba(0,0,0,0.6);
            border: 1px solid var(--accent); display: none; animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pa-decision-ui.show { display: block; }
        .pa-btns { display: flex; gap: 12px; margin-top: 16px; }
        .pa-btns button {
            flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .btn-yes { background: var(--success); color: #000; }
        .btn-yes:hover { background: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        .btn-no { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-no:hover { background: rgba(255,255,255,0.2); }
        
        .pa-result-box { margin-top: 16px; padding: 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.05); border-left: 3px solid var(--accent); display: none; font-size: 14px; line-height: 1.6;}
        .launch-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 16px; background: var(--accent); color: white; text-decoration: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;}

        /* ================= RIGHT PANEL ================= */
        .panel-right { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; }
        
        .qa-title-head { padding: 24px; border-bottom: 1px solid var(--glass-border); font-size: 16px; font-weight: 600; background: rgba(0,0,0,0.2); }
        .qa-list { padding: 24px; overflow-y: auto; flex: 1; }

        .qa-node {
            display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 10px;
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: var(--radius-md); transition: all 0.3s;
        }
        .qa-box {
            width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--text-muted);
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .qa-box svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; opacity: 0; transform: scale(0.5); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* States */
        .qa-node.done { border-color: var(--success); background: var(--success-glow); }
        .qa-node.done .qa-box { background: var(--success); border-color: var(--success); }
        .qa-node.done .qa-box svg { opacity: 1; transform: scale(1); }
        .qa-node.done span { color: var(--success); text-decoration: line-through; }

        .qa-node.missed { border-color: var(--danger); background: var(--danger-glow); }
        .qa-node.missed .qa-box { background: var(--danger); border-color: var(--danger); }
        .qa-node.missed .qa-box svg { opacity: 1; transform: scale(1); stroke: #fff; }
        .qa-node.missed span { color: var(--danger); }
        .qa-node span { font-size: 13px; font-weight: 500; transition: all 0.3s;}

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>

    <div class="app-workspace">
        
        <!-- LEFT PANEL -->
        <div class="glass-panel panel-left">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L12 22M6 8L6 16M18 8L18 16M3 11L3 13M21 11L21 13"/></svg>
                Techsoul Assist
            </div>

            <div class="ai-status-box">
                <div class="pulse-ring" id="statusDot"></div>
                <div style="font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px;">QA Percentage</div>
                <div style="font-size: 36px; font-weight: 700; color: #fff; line-height: 1;" id="scorePercent">0%</div>
                <div style="font-size: 11px; margin-top: 8px; color: var(--accent);" id="statusText">System Standby</div>
            </div>

            <button class="btn btn-ai" id="micBtn" onclick="toggleEngine()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                <span id="micText">Transcriber</span>
            </button>

            <div class="live-transcript">
                <div class="transcript-head">Neural Transcription Feed</div>
                <div class="transcript-body" id="transBox">
                    <span class="txt-final" id="tFinal"></span>
                    <span class="txt-interim" id="tInterim"></span>
                </div>
            </div>
        </div>

        <!-- MIDDLE PANEL -->
        <div class="glass-panel panel-middle">
            <div class="script-header">
                <h2>Call Script</h2>
                <select class="modern-select" id="taskSelector" onchange="updateTaskType()">
                    <option value="ads">Task: Ads Conversion Tracking</option>
                    <option value="ga4">Task: GA4 Setup & Linking</option>
                    <option value="consent">Task: Consent Mode V2</option>
                </select>
            </div>
            <div class="script-container" id="scriptScrollArea">
                <div id="scriptBlocks"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="glass-panel panel-right">
            <div class="qa-title-head">Live Flow Tracker</div>
            <div class="qa-list" id="qaList"></div>
        </div>

    </div>

    <script>
        // --- 1. OPTIMIZED & FORGIVING KEYWORDS ---
        let currentTaskType = "Ads Conversion Tracking";
        
        let scriptData = [
            { id: 'intro', title: '1. Greeting', keywords: ['technical solutions', 'google', 'how are you'], status: 'active', text: `"Hi! My name is <span class="kw">[Your Name]</span>, and I'm calling from the <span class="kw">Technical Solutions team on behalf of Google</span>. Am I speaking with <span class="kw">[Advertiser Name]</span>? <span class="kw">How are you doing today?</span>"` },
            
            { id: 'rec', title: '2. Recorded Line', keywords: ['recorded', 'monitored', 'privacy policy'], status: 'pending', text: `"This call may be <span class="kw">recorded or monitored</span> for quality, training and to improve Google's services, subject to our <span class="kw">Privacy Policy</span>. Do you agree?"` },
            
            { id: 'auth', title: '3. Authentication', keywords: ['customer id', 'email', 'website'], status: 'pending', text: `"To ensure that we're working on the correct account, please confirm your <span class="kw">10-digit Customer ID</span> along with your <span class="kw">email address</span> and your <span class="kw">website name</span>?"` },
            
            { id: 'task', title: '4. Task & Access', keywords: ['conversion tracking', 'admin access', 'backup'], status: 'pending', text: `"This request was submitted for the <span class="kw" id="taskHighlight">Ads Conversion Tracking</span>. Please confirm if you have <span class="kw">admin access</span> to your Google Ads account and to the admin panel of the website? Could you please confirm if a <span class="kw">backup</span> of the website was taken recently?"` },
            
            { id: 'share', title: '5. Screen Share', keywords: ['confidential', 'present', 'entire screen'], status: 'pending', text: `"Before sharing your screen Please, close all your private/<span class="kw">confidential windows</span>, tabs and confidential documents on your device. When you are ready, please click <span class="kw">'Present now'</span> and choose the <span class="kw">'Entire screen'</span> option."` },
            
            { id: 'pa_pitch', title: '6. PA Pitch', keywords: ['temporary access', 'revoked', 'session expires', 'do you agree'], status: 'pending', isConsent: true, text: `"We may proceed with the implementation from our end or by guiding you through each step.<br><br>To proceed with the creation of <span class="kw" id="paTaskHighlight">Ads Conversion Tracking</span> on your behalf, we would need to ask you for <span class="kw">temporary access</span> to your GTM/Google Ads account. It will let us create, save and publish the changes. This access will be <span class="kw">revoked when our session expires</span>.<br><br>You should receive an email with the access request from our side. <span class="kw">Do you agree</span> to allow us temporary access?"` },
            
            { id: 'sum', title: '7. Summarize Call', keywords: ['implemented', 'firing', 'conversions'], status: 'pending', text: `"During our interaction, we discussed and <span class="kw">implemented</span> the tags. We also verified that they are <span class="kw">firing correctly</span>. Any user coming through a google ad click visits your website and then performs the action it tracks as <span class="kw">conversions</span>."` },
            
            { id: 'close', title: '8. Test & Close', keywords: ['test conversion', 'validate', 'close the case'], status: 'pending', text: `"The implementation is complete, and we will monitor your account for few days. During this time, our quality team may perform a <span class="kw">test conversion</span> to validate the implementation.<br><br>Can I go ahead and <span class="kw">close the case?</span>"` },
            
            { id: 'gcss', title: '9. GCSS & Closure', keywords: ['feedback', 'partnership'], status: 'pending', text: `"We will be sending you a <span class="kw">feedback email</span> once your current case is closed. This feedback is focused solely on the interaction and experience you had with us. We appreciate your continued <span class="kw">partnership</span> with Google. Have a great day!"` }
        ];

        function renderUI() {
            const scriptCont = document.getElementById('scriptBlocks');
            const qaCont = document.getElementById('qaList');
            scriptCont.innerHTML = ''; qaCont.innerHTML = '';

            scriptData.forEach((item, index) => {
                // Script Area
                let sHtml = `
                    <div class="script-card ${item.status}" id="s-${item.id}">
                        <div class="step-title"><span>${item.title}</span></div>
                        <div class="step-text">${item.text}</div>`;
                
                // Add PA Decision Box (Only pops up if the status is DONE)
                if(item.isConsent) {
                    sHtml += `
                        <div class="pa-decision-ui" id="pa-ui">
                            <div style="font-size:14px; font-weight: 600; color:var(--accent); margin-bottom: 8px;">Action Required</div>
                            <div style="font-size:13px; color:var(--text-main);">Did the advertiser agree to Temporary Access?</div>
                            <div class="pa-btns">
                                <button class="btn-yes" onclick="handlePA(true, ${index})">YES, Access Granted</button>
                                <button class="btn-no" onclick="handlePA(false, ${index})">NO, Guide Mode</button>
                            </div>
                            <div class="pa-result-box" id="pa-result"></div>
                        </div>`;
                }
                sHtml += `</div>`;
                scriptCont.innerHTML += sHtml;

                // Checklist Area
                let qaClass = (item.status === 'done' || item.status === 'missed') ? 'done' : '';
                if(item.status === 'missed') qaClass = 'missed';

                qaCont.innerHTML += `
                    <div class="qa-node ${qaClass}" id="qa-${item.id}">
                        <div class="qa-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        <span>${item.title}</span>
                    </div>`;
            });

            updateScore();
            scrollToActive();
            
            // Logic to reveal the PA Pop-up ONLY when Step 6 is marked as 'done'
            if(scriptData[5].status === 'done') {
                const paUi = document.getElementById('pa-ui');
                if(paUi && !paUi.classList.contains('show')) paUi.classList.add('show');
            }
        }

        function updateTaskType() {
            const sel = document.getElementById('taskSelector').value;
            if(sel === 'ads') { currentTaskType = "Ads Conversion Tracking"; scriptData[3].keywords = ['conversion tracking', 'admin access', 'backup']; }
            else if(sel === 'ga4') { currentTaskType = "GA4 Setup & Linking"; scriptData[3].keywords = ['ga4 setup', 'analytics property', 'backup']; }
            else if(sel === 'consent') { currentTaskType = "Consent Mode V2"; scriptData[3].keywords = ['consent mode', 'certified cmp', 'admin access']; }
            
            scriptData[3].text = `"This request was submitted for the <span class="kw" id="taskHighlight">${currentTaskType}</span>. Please confirm if you have <span class="kw">admin access</span>... Could you please confirm if a <span class="kw">backup</span> of the website was taken recently?"`;
            scriptData[5].text = `"We may proceed with the implementation from our end or by guiding you through each step.<br><br>To proceed with the creation of <span class="kw" id="paTaskHighlight">${currentTaskType}</span> on your behalf, we would need to ask you for <span class="kw">temporary access</span> to your GTM/Google Ads account. It will let us create, save and publish the changes. This access will be <span class="kw">revoked when our session expires</span>.<br><br>You should receive an email with the access request from our side. <span class="kw">Do you agree</span> to allow us temporary access?"`;
            
            renderUI();
        }

        function handlePA(isYes, index) {
            const resBox = document.getElementById('pa-result');
            document.querySelector('.pa-btns').style.display = 'none';
            resBox.style.display = 'block';
            
            if(isYes) {
                resBox.innerHTML = `
                    <div style="color:var(--success); font-weight:700; margin-bottom:8px;">Access Accepted</div>
                    "Thank you! I will now guide you how to confirm our temporary access."<br>
                    <a href="https://tagsupport.corp.google.com/create-session" target="_blank" class="launch-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Launch TagSupport Session
                    </a>`;
            } else {
                resBox.innerHTML = `
                    <div style="color:var(--danger); font-weight:700; margin-bottom:8px;">Access Declined - Guide Mode</div>
                    "Thank you, we understand your concerns. In that case we will navigate you through the implementation process."`;
            }
        }

        function updateScore() {
            let comp = scriptData.filter(i => i.status === 'done' || i.status === 'missed').length;
            document.getElementById('scorePercent').innerText = `${Math.round((comp / scriptData.length) * 100)}%`;
        }

        function scrollToActive() {
            let target = scriptData.find(i => i.status === 'active') || scriptData.find(i => i.status === 'missed');
            if(target) {
                let el = document.getElementById(`s-${target.id}`);
                let area = document.getElementById('scriptScrollArea');
                if(el && area) {
                    let rect = el.getBoundingClientRect();
                    let aRect = area.getBoundingClientRect();
                    if(rect.top < aRect.top || rect.bottom > aRect.bottom) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // --- 2. BULLETPROOF INSTANT AI ENGINE ---
        let rec; let isStopped = true; let globalTranscript = "";

        function initEngine() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) { alert('Browser unsupported. Use Chrome for Speech API.'); return null; }
            let engine = new SR();
            engine.continuous = true; engine.interimResults = true;

            engine.onstart = () => {
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = 'Neural Engine Active';
            };

            engine.onresult = (e) => {
                let final = ''; let interim = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
                    else interim += e.results[i][0].transcript;
                }
                
                if(final) {
                    globalTranscript += final;
                    document.getElementById('tFinal').innerText = globalTranscript;
                    let tb = document.getElementById('transBox');
                    tb.scrollTop = tb.scrollHeight;
                }
                document.getElementById('tInterim').innerText = interim;

                // Continuous analysis of the entire accumulated text + live speech
                let instantLiveText = (globalTranscript + interim).toLowerCase();
                fastAnalyze(instantLiveText);
            };

            engine.onend = () => {
                document.getElementById('statusDot').classList.remove('active');
                if(!isStopped) {
                    document.getElementById('statusText').innerText = 'Re-engaging...';
                    setTimeout(() => { try { engine.start(); } catch(err){} }, 250); 
                } else { document.getElementById('statusText').innerText = 'System Standby'; }
            };

            engine.onerror = (e) => {
                if(e.error === 'not-allowed') { isStopped = true; toggleUI(false); alert('Microphone access denied.'); }
            };
            return engine;
        }

        function toggleEngine() {
            if(!rec) rec = initEngine();
            if(!rec) return;

            if(isStopped) {
                isStopped = false; toggleUI(true);
                try { rec.start(); } catch(e){}
            } else {
                isStopped = true; toggleUI(false);
                rec.stop();
            }
        }

        function toggleUI(on) {
            const btn = document.getElementById('micBtn');
            if(on) { btn.classList.add('listening'); document.getElementById('micText').innerText = 'Deactivate Transcriber'; }
            else { btn.classList.remove('listening'); document.getElementById('micText').innerText = 'Transcriber'; }
        }

        function fastAnalyze(text) {
            let highestMatch = -1;
            
            scriptData.forEach((step, index) => {
                if(step.status === 'pending' || step.status === 'active') {
                    // Match if ANY of the ultra-forgiving keywords are present
                    let matched = step.keywords.some(kw => text.includes(kw.toLowerCase()));
                    if(matched) highestMatch = Math.max(highestMatch, index);
                }
            });
            if(highestMatch !== -1) markDone(highestMatch);
        }

        function markDone(idx) {
            let changed = false;
            // Mark skipped steps RED
            for(let i = 0; i < idx; i++) {
                if(scriptData[i].status === 'pending' || scriptData[i].status === 'active') {
                    scriptData[i].status = 'missed'; changed = true;
                }
            }
            // Mark target DONE
            if(scriptData[idx].status !== 'done') {
                scriptData[idx].status = 'done'; changed = true;
                // REMOVED `globalTranscript = "";` TO ENSURE NO AUDIO IS DROPPED/WIPED BETWEEN STEPS
            }
            // Activate Next
            let next = idx + 1;
            if(next < scriptData.length && scriptData[next].status === 'pending') {
                scriptData[next].status = 'active'; changed = true;
            }
            
            if(changed) renderUI();
        }

        renderUI();
    </script>
</body>
</html>
