<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techsoul Assist | Enterprise AI</title>
    <!-- Premium Font Stack -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Ultra-Premium Dark Color Palette */
            --bg-obsidian: #030305;
            --bg-ambient: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.15), rgba(3, 3, 5, 1) 60%);
            
            --glass-base: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            --accent-primary: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent-glow: rgba(59, 130, 246, 0.5);
            
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            
            --danger: #f43f5e; /* Premium Rose/Crimson */
            --danger-glow: rgba(244, 63, 94, 0.3);
            
            --text-pure: #ffffff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --font-ui: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-obsidian);
            background-image: var(--bg-ambient);
            color: var(--text-main);
            height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .app-workspace {
            width: 100%; max-width: 1800px; height: 96vh;
            display: flex; gap: 24px; padding: 24px;
        }

        /* Billion-Dollar Glass Panels */
        .glass-panel {
            background: var(--glass-base);
            backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--glass-highlight), 0 30px 60px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; overflow: hidden;
            position: relative;
        }
        
        /* Subtle noise texture overlay for the true premium feel */
        .glass-panel::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* ================= LEFT PANEL (HUD) ================= */
        .panel-left { width: 350px; padding: 28px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px; z-index: 2; }

        .brand-logo {
            display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-pure);
        }
        .brand-logo svg {
            width: 32px; height: 32px; fill: none; stroke: url(#accentGradient); stroke-width: 2.5; filter: drop-shadow(0 0 12px var(--accent-glow));
        }

        .metric-card {
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
            padding: 24px; display: flex; flex-direction: column; align-items: center; position: relative;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        /* Custom Animated SVG Progress Ring */
        .progress-ring-container { position: relative; width: 140px; height: 140px; margin-bottom: 16px; }
        .progress-ring { transform: rotate(-90deg); width: 100%; height: 100%; }
        .progress-ring circle { fill: transparent; stroke-width: 6; stroke-linecap: round; }
        .ring-bg { stroke: rgba(255,255,255,0.05); }
        .ring-fill { stroke: var(--accent-primary); stroke-dasharray: 408; stroke-dashoffset: 408; transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.3s; filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .progress-value {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .score-num { font-size: 36px; font-weight: 700; color: var(--text-pure); line-height: 1; }
        .score-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .btn-transcriber {
            width: 100%; padding: 18px; border-radius: var(--radius-lg); border: none;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-pure); font-size: 14px; font-weight: 600; font-family: var(--font-ui);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; overflow: hidden;
        }
        .btn-transcriber::before {
            content: ''; position: absolute; inset: 0; background: var(--accent-gradient); opacity: 0; transition: opacity 0.3s; z-index: 0;
        }
        .btn-transcriber span, .btn-transcriber svg { position: relative; z-index: 1; transition: all 0.3s; }
        .btn-transcriber:hover { border-color: rgba(255,255,255,0.2); }
        
        .btn-transcriber.active { border-color: transparent; box-shadow: 0 10px 30px var(--accent-glow); }
        .btn-transcriber.active::before { opacity: 1; }
        
        /* Premium Terminal/Transcript */
        .live-terminal {
            flex: 1; background: #000000; border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
            display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-mono);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .terminal-header {
            padding: 12px 16px; background: rgba(255,255,255,0.05); font-size: 11px; font-weight: 500; color: var(--text-muted);
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: 0.3s; }
        .status-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
        
        .terminal-body { padding: 16px; flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.7; }
        .txt-final { color: #f8fafc; }
        .txt-interim { color: #64748b; }

        /* ================= MIDDLE PANEL (SCRIPT) ================= */
        .panel-middle { flex: 1; z-index: 1; }
        
        .header-bar {
            padding: 24px 32px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-bar h2 { font-size: 20px; font-weight: 600; color: var(--text-pure); }
        
        .task-dropdown {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: var(--text-pure);
            padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; font-family: var(--font-ui);
            outline: none; cursor: pointer; transition: 0.2s; appearance: none;
        }
        .task-dropdown:hover { border-color: rgba(255,255,255,0.3); }
        .task-dropdown option { background: var(--bg-obsidian); }

        .script-area { padding: 32px; overflow-y: auto; height: calc(100% - 85px); scroll-behavior: smooth; }

        .script-block {
            padding: 28px; margin-bottom: 24px; border-radius: var(--radius-lg);
            background: rgba(255,255,255,0.015); border: 1px solid var(--glass-border);
            position: relative; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        /* Left indicator line */
        .script-block::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,0.1); transition: 0.5s;
        }
        
        /* Active State: Glowing aurora background */
        .script-block.active {
            background: linear-gradient(145deg, rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0.03) 100%);
            border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(1.01) translateY(-2px);
        }
        .script-block.active::before { width: 4px; background: var(--accent-primary); box-shadow: 0 0 15px var(--accent-primary); }
        
        .script-block.done { opacity: 0.5; }
        .script-block.done::before { background: var(--success); }
        
        .script-block.missed { background: rgba(244, 63, 94, 0.03); border-color: rgba(244, 63, 94, 0.2); }
        .script-block.missed::before { background: var(--danger); box-shadow: 0 0 15px var(--danger); }

        .block-title {
            font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .script-block.active .block-title { color: var(--accent-primary); }
        .script-block.done .block-title { color: var(--success); }
        .script-block.missed .block-title { color: var(--danger); }
        
        .missed-badge { display: none; background: var(--danger); color: #fff; padding: 4px 10px; border-radius: 100px; font-size: 10px; letter-spacing: 0.5px; }
        .script-block.missed .missed-badge { display: inline-block; }

        .block-text { font-size: 17px; line-height: 1.7; color: var(--text-main); font-weight: 300; }
        .kw-tag { 
            font-weight: 500; color: #fff; background: rgba(255,255,255,0.08); 
            padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); 
            transition: 0.3s;
        }
        .script-block.active .kw-tag { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); }

        /* PA Pitch Decision Component */
        .decision-modal {
            margin-top: 24px; padding: 24px; border-radius: var(--radius-md); background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1); display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .decision-modal.show { display: block; }
        .decision-title { font-size: 14px; font-weight: 600; color: var(--text-pure); margin-bottom: 6px; }
        
        .decision-btns { display: flex; gap: 16px; margin-top: 20px; }
        .d-btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); border: none; font-family: var(--font-ui); font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .d-btn.yes { background: var(--text-pure); color: #000; }
        .d-btn.yes:hover { background: #e2e8f0; transform: translateY(-2px); }
        .d-btn.no { background: rgba(255,255,255,0.05); color: var(--text-pure); border: 1px solid rgba(255,255,255,0.1); }
        .d-btn.no:hover { background: rgba(255,255,255,0.1); }
        
        .result-view { margin-top: 20px; display: none; font-size: 15px; font-weight: 300; line-height: 1.6; }
        .launch-btn {
            display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 20px;
            background: var(--accent-gradient); color: #fff; text-decoration: none; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 14px; box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;
        }
        .launch-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }

        /* ================= RIGHT PANEL ================= */
        .panel-right { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; z-index: 2; }
        
        .tracker-list { padding: 32px 24px; overflow-y: auto; flex: 1; }

        .tracker-item {
            display: flex; align-items: center; gap: 16px; padding: 16px; margin-bottom: 12px;
            background: rgba(255,255,255,0.02); border: 1px solid transparent; border-radius: var(--radius-md); transition: all 0.3s;
        }
        
        .check-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .check-circle svg { width: 12px; height: 12px; fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; opacity: 0; transform: scale(0.5); transition: 0.3s; }
        
        .tracker-item.done { background: rgba(255,255,255,0.04); border-color: rgba(16, 185, 129, 0.2); }
        .tracker-item.done .check-circle { background: var(--success); border-color: var(--success); box-shadow: 0 0 15px var(--success-glow); }
        .tracker-item.done .check-circle svg { opacity: 1; transform: scale(1); }
        .tracker-item.done span { color: var(--text-muted); text-decoration: line-through; }

        .tracker-item.missed { background: rgba(244, 63, 94, 0.05); border-color: rgba(244, 63, 94, 0.2); }
        .tracker-item.missed .check-circle { background: var(--danger); border-color: var(--danger); }
        .tracker-item.missed .check-circle svg { opacity: 1; transform: scale(1); stroke: #fff; }
        .tracker-item.missed span { color: var(--danger); }
        
        .tracker-item span { font-size: 14px; font-weight: 500; transition: 0.3s; color: var(--text-main); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* SVG Gradient Definition */
        svg { overflow: visible; }
    </style>
</head>
<body>

    <!-- SVG Gradients defined here for re-use -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-workspace">
        
        <!-- ================= LEFT PANEL ================= -->
        <div class="glass-panel panel-left">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L12 22M6 8L6 16M18 8L18 16M3 11L3 13M21 11L21 13"/></svg>
                Techsoul
            </div>

            <div class="metric-card">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="65"></circle>
                        <circle class="ring-fill" id="scoreRing" cx="70" cy="70" r="65"></circle>
                    </svg>
                    <div class="progress-value">
                        <div class="score-num" id="scorePercent">0%</div>
                        <div class="score-label">QA Score</div>
                    </div>
                </div>
            </div>

            <button class="btn-transcriber" id="micBtn" onclick="toggleEngine()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                <span id="micText">Transcriber</span>
            </button>

            <div class="live-terminal">
                <div class="terminal-header">
                    <span>Live AI Audio Stream</span>
                    <div class="status-dot" id="statusDot"></div>
                </div>
                <div class="terminal-body" id="transBox">
                    <span class="txt-final" id="tFinal"></span>
                    <span class="txt-interim" id="tInterim"></span>
                </div>
            </div>
        </div>

        <!-- ================= MIDDLE PANEL ================= -->
        <div class="glass-panel panel-middle">
            <div class="header-bar">
                <h2>Call Script</h2>
                <select class="task-dropdown" id="taskSelector" onchange="updateTaskType()">
                    <option value="ads">Task: Ads Conversion Tracking</option>
                    <option value="ga4">Task: GA4 Setup & Linking</option>
                    <option value="consent">Task: Consent Mode V2</option>
                </select>
            </div>
            <div class="script-area" id="scriptScrollArea">
                <div id="scriptBlocks"></div>
            </div>
        </div>

        <!-- ================= RIGHT PANEL ================= -->
        <div class="glass-panel panel-right">
            <div class="header-bar">
                <h2>Flow Tracker</h2>
            </div>
            <div class="tracker-list" id="qaList"></div>
        </div>

    </div>

    <script>
        // --- 1. SCRIPT & KEYWORD ENGINE ---
        let currentTaskType = "Ads Conversion Tracking";
        
        let scriptData = [
            { id: 'intro', title: '1. Greeting', keywords: ['technical solutions', 'google', 'how are you'], status: 'active', text: `"Hi! My name is <span class="kw-tag">[Your Name]</span>, and I'm calling from the <span class="kw-tag">Technical Solutions team on behalf of Google</span>. Am I speaking with <span class="kw-tag">[Advertiser Name]</span>? <span class="kw-tag">How are you doing today?</span>"` },
            
            { id: 'rec', title: '2. Recorded Line', keywords: ['recorded', 'monitored', 'privacy policy'], status: 'pending', text: `"This call may be <span class="kw-tag">recorded or monitored</span> for quality, training and to improve Google's services, subject to our <span class="kw-tag">Privacy Policy</span>. Do you agree?"` },
            
            { id: 'auth', title: '3. Authentication', keywords: ['customer id', 'email', 'website'], status: 'pending', text: `"To ensure that we're working on the correct account, please confirm your <span class="kw-tag">10-digit Customer ID</span> along with your <span class="kw-tag">email address</span> and your <span class="kw-tag">website name</span>?"` },
            
            { id: 'task', title: '4. Task & Access', keywords: ['conversion tracking', 'admin access', 'backup'], status: 'pending', text: `"This request was submitted for the <span class="kw-tag" id="taskHighlight">Ads Conversion Tracking</span>. Please confirm if you have <span class="kw-tag">admin access</span> to your Google Ads account and to the admin panel of the website? Could you please confirm if a <span class="kw-tag">backup</span> of the website was taken recently?"` },
            
            { id: 'share', title: '5. Screen Share', keywords: ['confidential', 'present', 'entire screen'], status: 'pending', text: `"Before sharing your screen Please, close all your private/<span class="kw-tag">confidential windows</span>, tabs and confidential documents on your device. When you are ready, please click <span class="kw-tag">'Present now'</span> and choose the <span class="kw-tag">'Entire screen'</span> option."` },
            
            { id: 'pa_pitch', title: '6. PA Pitch', keywords: ['temporary access', 'revoked', 'session expires', 'do you agree'], status: 'pending', isConsent: true, text: `"We may proceed with the implementation from our end or by guiding you through each step.<br><br>To proceed with the creation of <span class="kw-tag" id="paTaskHighlight">Ads Conversion Tracking</span> on your behalf, we would need to ask you for <span class="kw-tag">temporary access</span> to your GTM/Google Ads account. It will let us create, save and publish the changes. This access will be <span class="kw-tag">revoked when our session expires</span>.<br><br>You should receive an email with the access request from our side. <span class="kw-tag">Do you agree</span> to allow us temporary access?"` },
            
            { id: 'sum', title: '7. Summarize Call', keywords: ['implemented', 'firing', 'conversions'], status: 'pending', text: `"During our interaction, we discussed and <span class="kw-tag">implemented</span> the tags. We also verified that they are <span class="kw-tag">firing correctly</span>. Any user coming through a google ad click visits your website and then performs the action it tracks as <span class="kw-tag">conversions</span>."` },
            
            { id: 'close', title: '8. Test & Close', keywords: ['test conversion', 'validate', 'close the case'], status: 'pending', text: `"The implementation is complete, and we will monitor your account for few days. During this time, our quality team may perform a <span class="kw-tag">test conversion</span> to validate the implementation.<br><br>Can I go ahead and <span class="kw-tag">close the case?</span>"` },
            
            { id: 'gcss', title: '9. GCSS & Closure', keywords: ['feedback', 'partnership'], status: 'pending', text: `"We will be sending you a <span class="kw-tag">feedback email</span> once your current case is closed. This feedback is focused solely on the interaction and experience you had with us. We appreciate your continued <span class="kw-tag">partnership</span> with Google. Have a great day!"` }
        ];

        function renderUI() {
            const scriptCont = document.getElementById('scriptBlocks');
            const qaCont = document.getElementById('qaList');
            scriptCont.innerHTML = ''; qaCont.innerHTML = '';

            scriptData.forEach((item, index) => {
                // SCRIPT BLOCKS
                let sHtml = `
                    <div class="script-block ${item.status}" id="s-${item.id}">
                        <div class="block-title">
                            <span>${item.title}</span>
                            <span class="missed-badge">MISSED</span>
                        </div>
                        <div class="block-text">${item.text}</div>`;
                
                // DECISION MODAL (PA PITCH)
                if(item.isConsent) {
                    sHtml += `
                        <div class="decision-modal" id="pa-ui">
                            <div class="decision-title">Did the advertiser agree to Temporary Access?</div>
                            <div class="decision-btns">
                                <button class="d-btn yes" onclick="handlePA(true, ${index})">Access Granted</button>
                                <button class="d-btn no" onclick="handlePA(false, ${index})">Guide Mode</button>
                            </div>
                            <div class="result-view" id="pa-result"></div>
                        </div>`;
                }
                sHtml += `</div>`;
                scriptCont.innerHTML += sHtml;

                // FLOW TRACKER
                let qaClass = (item.status === 'done' || item.status === 'missed') ? item.status : '';
                
                qaCont.innerHTML += `
                    <div class="tracker-item ${qaClass}" id="qa-${item.id}">
                        <div class="check-circle"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        <span>${item.title}</span>
                    </div>`;
            });

            updateScore();
            scrollToActive();
            
            // Reveal PA Pop-up ONLY when Step 6 is 'done'
            if(scriptData[5].status === 'done') {
                const paUi = document.getElementById('pa-ui');
                if(paUi && !paUi.classList.contains('show')) paUi.classList.add('show');
            }
        }

        function updateTaskType() {
            const sel = document.getElementById('taskSelector').value;
            if(sel === 'ads') { currentTaskType = "Ads Conversion Tracking"; scriptData[3].keywords = ['conversion tracking', 'admin access', 'backup']; }
            else if(sel === 'ga4') { currentTaskType = "GA4 Setup & Linking"; scriptData[3].keywords = ['ga4 setup', 'analytics property', 'backup']; }
            else if(sel === 'consent') { currentTaskType = "Consent Mode V2"; scriptData[3].keywords = ['consent mode', 'certified cmp', 'admin access']; }
            
            scriptData[3].text = `"This request was submitted for the <span class="kw-tag" id="taskHighlight">${currentTaskType}</span>. Please confirm if you have <span class="kw-tag">admin access</span>... Could you please confirm if a <span class="kw-tag">backup</span> of the website was taken recently?"`;
            scriptData[5].text = `"We may proceed with the implementation from our end or by guiding you through each step.<br><br>To proceed with the creation of <span class="kw-tag" id="paTaskHighlight">${currentTaskType}</span> on your behalf, we would need to ask you for <span class="kw-tag">temporary access</span> to your GTM/Google Ads account. It will let us create, save and publish the changes. This access will be <span class="kw-tag">revoked when our session expires</span>.<br><br>You should receive an email with the access request from our side. <span class="kw-tag">Do you agree</span> to allow us temporary access?"`;
            
            renderUI();
        }

        function handlePA(isYes, index) {
            const resBox = document.getElementById('pa-result');
            document.querySelector('.decision-btns').style.display = 'none';
            resBox.style.display = 'block';
            
            if(isYes) {
                resBox.innerHTML = `
                    <div style="color:var(--success); font-weight:700; margin-bottom:8px;">Access Accepted</div>
                    "Thank you! I will now guide you how to confirm our temporary access."<br>
                    <a href="https://tagsupport.corp.google.com/create-session" target="_blank" class="launch-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        Launch TagSupport Session
                    </a>`;
            } else {
                resBox.innerHTML = `
                    <div style="color:var(--text-muted); font-weight:700; margin-bottom:8px;">Access Declined (Guide Mode)</div>
                    <span style="color:var(--text-pure);">"Thank you, we understand your concerns. In that case we will navigate you through the implementation process."</span>`;
            }
        }

        function updateScore() {
            let comp = scriptData.filter(i => i.status === 'done' || i.status === 'missed').length;
            let percent = Math.round((comp / scriptData.length) * 100);
            
            document.getElementById('scorePercent').innerText = `${percent}%`;
            
            // Calculate SVG Stroke Offset (Total circumference is ~408)
            let offset = 408 - (percent / 100) * 408;
            document.getElementById('scoreRing').style.strokeDashoffset = offset;
        }

        function scrollToActive() {
            let target = scriptData.find(i => i.status === 'active') || scriptData.find(i => i.status === 'missed');
            if(target) {
                let el = document.getElementById(`s-${target.id}`);
                let area = document.getElementById('scriptScrollArea');
                if(el && area) {
                    let rect = el.getBoundingClientRect();
                    let aRect = area.getBoundingClientRect();
                    if(rect.top < aRect.top || rect.bottom > aRect.bottom) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // --- 2. BILLION-DOLLAR VOICE ENGINE (Zero Dropout) ---
        let rec; let isStopped = true; let globalTranscript = "";

        function initEngine() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) { alert('Browser unsupported. Use Google Chrome.'); return null; }
            let engine = new SR();
            engine.continuous = true; engine.interimResults = true;

            engine.onstart = () => {
                document.getElementById('statusDot').classList.add('active');
            };

            engine.onresult = (e) => {
                let final = ''; let interim = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
                    else interim += e.results[i][0].transcript;
                }
                
                if(final) {
                    globalTranscript += final;
                    document.getElementById('tFinal').innerText = globalTranscript;
                    let tb = document.getElementById('transBox');
                    tb.scrollTop = tb.scrollHeight;
                }
                document.getElementById('tInterim').innerText = interim;

                // Analyzes full continuous text stream instantly
                let instantLiveText = (globalTranscript + interim).toLowerCase();
                fastAnalyze(instantLiveText);
            };

            engine.onend = () => {
                document.getElementById('statusDot').classList.remove('active');
                if(!isStopped) {
                    setTimeout(() => { try { engine.start(); } catch(err){} }, 100); 
                }
            };

            engine.onerror = (e) => {
                if(e.error === 'not-allowed') { isStopped = true; toggleUI(false); alert('Microphone access denied.'); }
            };
            return engine;
        }

        function toggleEngine() {
            if(!rec) rec = initEngine();
            if(!rec) return;

            if(isStopped) {
                isStopped = false; toggleUI(true);
                try { rec.start(); } catch(e){}
            } else {
                isStopped = true; toggleUI(false);
                rec.stop();
            }
        }

        function toggleUI(on) {
            const btn = document.getElementById('micBtn');
            if(on) { btn.classList.add('active'); document.getElementById('micText').innerText = 'Deactivate Engine'; }
            else { btn.classList.remove('active'); document.getElementById('micText').innerText = 'Transcriber'; }
        }

        function fastAnalyze(text) {
            let highestMatch = -1;
            
            scriptData.forEach((step, index) => {
                if(step.status === 'pending' || step.status === 'active') {
                    let matched = step.keywords.some(kw => text.includes(kw.toLowerCase()));
                    if(matched) highestMatch = Math.max(highestMatch, index);
                }
            });
            if(highestMatch !== -1) markDone(highestMatch);
        }

        function markDone(idx) {
            let changed = false;
            // Mark skipped steps RED
            for(let i = 0; i < idx; i++) {
                if(scriptData[i].status === 'pending' || scriptData[i].status === 'active') {
                    scriptData[i].status = 'missed'; changed = true;
                }
            }
            // Mark target DONE
            if(scriptData[idx].status !== 'done') {
                scriptData[idx].status = 'done'; changed = true;
                // No global transcript wipe ensures flawless continuity
            }
            // Activate Next
            let next = idx + 1;
            if(next < scriptData.length && scriptData[next].status === 'pending') {
                scriptData[next].status = 'active'; changed = true;
            }
            
            if(changed) renderUI();
        }

        renderUI();
    </script>
</body>
</html>
