<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techsoul Assist | Voice-to-Text QA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Dark Theme Variables */
            --bg-base: #09090b;
            --surface-100: #18181b;
            --surface-200: #27272a;
            --border-color: #3f3f46;
            
            --accent-primary: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.4);
            
            --success: #10b981; /* Emerald */
            --success-glow: rgba(16, 185, 129, 0.15);
            
            --danger: #ef4444; /* Stark Red for Missed */
            --danger-glow: rgba(239, 68, 68, 0.15);
            
            --text-primary: #f8fafc;
            --text-secondary: #a1a1aa;
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --font-sans: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans); background-color: var(--bg-base); color: var(--text-primary);
            height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.05) 0%, transparent 60%);
        }

        .app-container {
            width: 100%; max-width: 1800px; height: 96vh; display: flex; gap: 20px; padding: 20px;
        }

        .panel {
            background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        /* ================= LEFT PANEL (HUD & TRANSCRIPT) ================= */
        .panel-left { width: 340px; padding: 24px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }

        .brand {
            display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: #fff;
        }
        .brand svg {
            width: 30px; height: 30px; fill: none; stroke: var(--accent-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .status-card {
            background: linear-gradient(145deg, var(--surface-100), var(--bg-base));
            border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; text-align: center;
        }
        .ai-status-indicator {
            width: 10px; height: 10px; border-radius: 50%; background: #52525b; display: inline-block; margin-right: 8px;
        }
        .ai-status-indicator.listening { background: var(--success); box-shadow: 0 0 12px var(--success), 0 0 24px var(--success); animation: pulse 1.5s infinite; }
        .status-text { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #4f46e5; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-primary.active { background: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        /* LIVE TRANSCRIPT BOX */
        .transcript-box {
            flex: 1; background: #000; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .transcript-header {
            background: var(--surface-200); padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
        }
        .transcript-content {
            padding: 12px; flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.6; color: var(--text-primary);
        }
        .transcript-final { color: #fff; }
        .transcript-interim { color: var(--text-secondary); font-style: italic; }

        .console-feed {
            height: 100px; background: #000; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 12px; font-family: monospace; font-size: 11px; color: var(--text-secondary); overflow-y: auto;
        }
        .console-feed span.match { color: var(--success); }
        .console-feed span.miss { color: var(--danger); }

        /* ================= MIDDLE PANEL (SCRIPT) ================= */
        .panel-middle { flex: 1; position: relative; display: flex; flex-direction: column;}

        .panel-header {
            padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(24, 24, 27, 0.9); z-index: 10;
        }
        .panel-header h2 { font-size: 18px; font-weight: 600; }

        select.task-dropdown {
            background: var(--surface-200); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; outline: none; cursor: pointer;
        }

        .script-scroll { padding: 32px; overflow-y: auto; flex: 1; scroll-behavior: smooth; }

        .script-block {
            padding: 24px; margin-bottom: 24px; border-radius: var(--radius-md); background: var(--surface-100); border: 1px solid var(--border-color); border-left: 4px solid var(--border-color); transition: all 0.3s;
        }
        .script-block.active { border-color: var(--accent-primary); border-left: 4px solid var(--accent-primary); background: rgba(99, 102, 241, 0.05); transform: translateX(4px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .script-block.done { border-left-color: var(--success); opacity: 0.6; }
        .script-block.missed { border-left-color: var(--danger); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }

        .script-title { font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--text-secondary); }
        .script-block.active .script-title { color: var(--accent-primary); }
        .script-block.done .script-title { color: var(--success); text-decoration: line-through; }
        .script-block.missed .script-title { color: var(--danger); }
        .script-block.missed .script-title::after { content: 'MISSED STEP'; background: var(--danger); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        .script-text { font-size: 15px; line-height: 1.7; color: var(--text-primary); }
        .keyword-highlight { font-weight: 600; color: #fff; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }

        /* ================= RIGHT PANEL (CHECKLIST) ================= */
        .panel-right { width: 340px; flex-shrink: 0; display: flex; flex-direction: column;}
        
        .qa-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .qa-scroll { padding: 24px; overflow-y: auto; flex: 1; }

        .qa-item {
            display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface-100); border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 10px; transition: all 0.3s;
        }
        
        .qa-checkbox {
            width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .qa-checkbox svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.5); }
        
        /* DONE STATE */
        .qa-item.done { border-color: var(--success); background: var(--success-glow); }
        .qa-item.done .qa-checkbox { background: var(--success); border-color: var(--success); }
        .qa-item.done .qa-checkbox svg { opacity: 1; transform: scale(1); }
        .qa-item.done .qa-title { color: var(--success); text-decoration: line-through; }

        /* MISSED (RED) STATE */
        .qa-item.missed { border-color: var(--danger); background: var(--danger-glow); }
        .qa-item.missed .qa-checkbox { background: var(--danger); border-color: var(--danger); }
        .qa-item.missed .qa-checkbox svg { opacity: 1; transform: scale(1); stroke: #fff; }
        .qa-item.missed .qa-title { color: var(--danger); }

        .qa-title { font-size: 13px; font-weight: 500; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. LEFT PANEL -->
        <div class="panel panel-left">
            <div class="brand">
                <svg viewBox="0 0 24 24"><path d="M12 2L12 22M6 8L6 16M18 8L18 16M3 11L3 13M21 11L21 13"/></svg>
                Techsoul Assist
            </div>

            <div class="status-card">
                <div style="margin-bottom: 12px;">
                    <span class="ai-status-indicator" id="statusDot"></span>
                    <span class="status-text" id="statusText">System Offline</span>
                </div>
                <div style="font-size: 32px; font-weight: 700; color: #fff;" id="progressScore">0%</div>
            </div>

            <button class="btn btn-primary" id="micBtn" onclick="toggleListening()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                <span id="micBtnText">Initialize AI Listener</span>
            </button>

            <!-- LIVE TRANSCRIPT -->
            <div class="transcript-box">
                <div class="transcript-header">Real-Time Audio Transcript</div>
                <div class="transcript-content" id="transcriptWindow">
                    <span class="transcript-final" id="transcriptFinal"></span>
                    <span class="transcript-interim" id="transcriptInterim"></span>
                </div>
            </div>

            <div class="console-feed" id="consoleOutput">
                > Engine ready.<br>
            </div>
        </div>

        <!-- 2. MIDDLE PANEL -->
        <div class="panel panel-middle">
            <div class="panel-header">
                <h2>Verbiage Guide</h2>
                <select class="task-dropdown" id="taskSelect" onchange="updateTaskType()">
                    <option value="ads">Task: Ads Conversion Tracking</option>
                    <option value="ga4">Task: GA4 Setup & Linking</option>
                    <option value="consent">Task: Consent Mode V2</option>
                </select>
            </div>
            <div class="script-scroll" id="scriptScrollArea">
                <div id="scriptContainer"></div>
            </div>
        </div>

        <!-- 3. RIGHT PANEL -->
        <div class="panel panel-right">
            <div class="qa-header"><h3>Live Flow Tracker</h3></div>
            <div class="qa-scroll" id="qaScrollArea">
                <div id="qaContainer"></div>
            </div>
        </div>

    </div>

    <script>
        // 1. FORGIVING KEYWORDS - Shorter phrases means a much higher match rate.
        let scriptData = [
            { id: 'intro', title: '1. Greeting', keywords: ['technical solutions', 'behalf of google', 'am i speaking with'], status: 'active', text: `"Hi! My name is <span class="keyword-highlight">[Your Name]</span>, and I'm calling from the Technical Solutions team on behalf of Google. Am I speaking with <span class="keyword-highlight">[Advertiser Name]</span>? How are you doing today?"` },
            { id: 'rec', title: '2. Recorded Line', keywords: ['recorded', 'monitored', 'privacy policy'], status: 'pending', text: `"This call may be recorded or monitored for quality, training and to improve Google's services, subject to our Privacy Policy. Do you agree?"` },
            { id: 'auth', title: '3. Authentication', keywords: ['customer id', 'email address', 'website name'], status: 'pending', text: `"To ensure that we're working on the correct account, please confirm your <span class="keyword-highlight">10-digit Customer ID</span> along with your <span class="keyword-highlight">email address</span> and your <span class="keyword-highlight">website name</span>?"` },
            { id: 'task', title: '4. Task & Access', keywords: ['conversion tracking', 'admin access', 'backup'], status: 'pending', text: `"This request was submitted for the <span class="keyword-highlight">Ads Conversion Tracking</span>. Please confirm if you have admin access to your Google Ads account and to the admin panel of the website? Could you please confirm if a backup of the website was taken recently?"` },
            { id: 'share', title: '5. Screen Share', keywords: ['confidential', 'present now', 'entire screen'], status: 'pending', text: `"Before sharing your screen Please, close all your private/confidential windows. When you are ready, please click 'Present now' and choose 'Entire screen'."` },
            { id: 'pa_pitch', title: '6. PA Pitch', keywords: ['implementation', 'temporary access', 'guiding you'], status: 'pending', text: `"We may proceed with the implementation from our end or by guiding you through each step. To proceed with the creation on your behalf, we would need to ask you for temporary access. Do you agree?"` },
            { id: 'sum', title: '7. Summarize Call', keywords: ['implemented', 'firing correctly'], status: 'pending', text: `"During our interaction, we discussed and implemented the tags. We also verified that they are firing correctly."` },
            { id: 'close', title: '8. Test & Close', keywords: ['test conversion', 'close the case'], status: 'pending', text: `"The implementation is complete. Our quality team may perform a test conversion to validate. Can I go ahead and close the case?"` },
            { id: 'gcss', title: '9. GCSS Feedback', keywords: ['feedback email', 'partnership with google'], status: 'pending', text: `"We will be sending you a feedback email once your current case is closed. We appreciate your continued partnership with Google. Have a great day!"` }
        ];

        function renderUI() {
            const scriptContainer = document.getElementById('scriptContainer');
            const qaContainer = document.getElementById('qaContainer');
            scriptContainer.innerHTML = ''; qaContainer.innerHTML = '';

            scriptData.forEach((item, index) => {
                let blockHTML = `
                    <div class="script-block ${item.status}" id="script-${item.id}">
                        <div class="script-title"><span>${item.title}</span></div>
                        <div class="script-text">${item.text}</div>
                    </div>`;
                scriptContainer.innerHTML += blockHTML;

                let checkedClass = (item.status === 'done' || item.status === 'missed') ? 'done' : '';
                if(item.status === 'missed') checkedClass = 'missed'; // RED

                qaContainer.innerHTML += `
                    <div class="qa-item ${checkedClass}" id="qa-${item.id}">
                        <div class="qa-checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        <div class="qa-title">${item.title}</div>
                    </div>`;
            });

            updateProgress();
            scrollToActive();
        }

        function updateTaskType() {
            const type = document.getElementById('taskSelect').value;
            if(type === 'ads') {
                scriptData[3].text = `"This request was submitted for the <span class="keyword-highlight">Ads Conversion Tracking</span>..."`;
                scriptData[3].keywords = ['conversion tracking', 'admin access'];
            } else if (type === 'ga4') {
                scriptData[3].text = `"This request was submitted for the <span class="keyword-highlight">GA4 Setup and Linking</span>..."`;
                scriptData[3].keywords = ['ga4 setup', 'analytics property'];
            } else if (type === 'consent') {
                scriptData[3].text = `"This request was submitted for <span class="keyword-highlight">Consent Mode V2</span>..."`;
                scriptData[3].keywords = ['consent mode', 'certified cmp'];
            }
            renderUI();
        }

        function updateProgress() {
            let completed = scriptData.filter(i => i.status === 'done' || i.status === 'missed').length;
            let percent = Math.round((completed / scriptData.length) * 100);
            document.getElementById('progressScore').innerText = `${percent}%`;
        }

        function scrollToActive() {
            let target = scriptData.find(i => i.status === 'active') || scriptData.find(i => i.status === 'missed');
            if (target) {
                let el = document.getElementById(`script-${target.id}`);
                if (el) {
                    const scrollArea = document.getElementById('scriptScrollArea');
                    const rect = el.getBoundingClientRect();
                    const areaRect = scrollArea.getBoundingClientRect();
                    // Scroll only if out of view
                    if (rect.top < areaRect.top || rect.bottom > areaRect.bottom) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        }

        const consoleFeed = document.getElementById('consoleOutput');
        function logMsg(msg, type = 'normal') {
            let colorClass = '';
            if(type === 'match') colorClass = 'match';
            if(type === 'miss') colorClass = 'miss';
            consoleFeed.innerHTML += `> <span class="${colorClass}">${msg}</span><br>`;
            consoleFeed.scrollTop = consoleFeed.scrollHeight;
        }

        // ================= BULLETPROOF VOICE ENGINE =================
        let recognition;
        let isIntentionalStop = true;
        let fullSessionTranscript = "";

        function initVoiceEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRec) { logMsg('FATAL: Browser does not support Web Speech API.', 'miss'); return null; }
            
            let rec = new SpeechRec();
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
                document.getElementById('statusDot').classList.add('listening');
                document.getElementById('statusText').innerText = 'Actively Listening...';
                logMsg('Microphone engaged.');
            };

            rec.onresult = (e) => {
                let interim = '';
                let final = '';
                
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        final += e.results[i][0].transcript + ' ';
                    } else {
                        interim += e.results[i][0].transcript;
                    }
                }
                
                // Print to Live UI
                if (final) {
                    fullSessionTranscript += final;
                    document.getElementById('transcriptFinal').innerText = fullSessionTranscript;
                    
                    // Auto-scroll transcript window
                    const tWindow = document.getElementById('transcriptWindow');
                    tWindow.scrollTop = tWindow.scrollHeight;
                    
                    analyzeTranscript(final.toLowerCase());
                }
                document.getElementById('transcriptInterim').innerText = interim;
            };

            // AGGRESSIVE RESTART LOGIC - Never stops unless you click stop
            rec.onend = () => {
                document.getElementById('statusDot').classList.remove('listening');
                if (!isIntentionalStop) {
                    document.getElementById('statusText').innerText = 'Re-engaging...';
                    setTimeout(() => {
                        try { rec.start(); } catch(err) {}
                    }, 100); // Instantly force it back on
                } else {
                    document.getElementById('statusText').innerText = 'System Offline';
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    isIntentionalStop = true; toggleListeningState(false);
                    logMsg('ERROR: Mic permission denied.', 'miss');
                }
                // Other errors (network, no-speech) will naturally fall through to onend and restart automatically
            };
            return rec;
        }

        function toggleListening() {
            if(!recognition) recognition = initVoiceEngine();
            if(!recognition) return;

            if (isIntentionalStop) {
                isIntentionalStop = false;
                toggleListeningState(true);
                try { recognition.start(); } catch(e){}
            } else {
                isIntentionalStop = true;
                toggleListeningState(false);
                recognition.stop();
                logMsg('System deactivated.');
            }
        }

        function toggleListeningState(isActive) {
            const btn = document.getElementById('micBtn');
            if (isActive) {
                btn.classList.add('active'); document.getElementById('micBtnText').innerText = 'Deactivate AI';
            } else {
                btn.classList.remove('active'); document.getElementById('micBtnText').innerText = 'Initialize AI Listener';
            }
        }

        // ================= MISSED STEP DETECTION =================
        function analyzeTranscript(text) {
            let highestMatchIndex = -1;

            scriptData.forEach((step, index) => {
                if (step.status === 'pending' || step.status === 'active') {
                    // Check if the AI heard ANY of the keywords for this step
                    let matchFound = step.keywords.some(kw => text.includes(kw.toLowerCase()));
                    if (matchFound) highestMatchIndex = Math.max(highestMatchIndex, index);
                }
            });

            if (highestMatchIndex !== -1) markStepDone(highestMatchIndex);
        }

        function markStepDone(matchedIndex) {
            let stateChanged = false;

            // Mark prior skipped steps as RED/MISSED
            for (let i = 0; i < matchedIndex; i++) {
                if (scriptData[i].status === 'pending' || scriptData[i].status === 'active') {
                    scriptData[i].status = 'missed';
                    logMsg(`FLAG: Skipped "${scriptData[i].title}"`, 'miss');
                    stateChanged = true;
                }
            }

            // Mark matched step as DONE
            if (scriptData[matchedIndex].status !== 'done') {
                scriptData[matchedIndex].status = 'done';
                logMsg(`CHECK: "${scriptData[matchedIndex].title}"`, 'match');
                stateChanged = true;
            }

            // Activate next step
            let nextIndex = matchedIndex + 1;
            if (nextIndex < scriptData.length && scriptData[nextIndex].status === 'pending') {
                scriptData[nextIndex].status = 'active';
                stateChanged = true;
            }

            if (stateChanged) renderUI();
        }

        renderUI();
    </script>
</body>
</html>
