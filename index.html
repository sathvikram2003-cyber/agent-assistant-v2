<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techsoul Assist | AI Verbiage Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Dark Theme Variables */
            --bg-base: #09090b;
            --surface-100: #18181b;
            --surface-200: #27272a;
            --border-color: #3f3f46;
            
            --accent-primary: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.4);
            
            --success: #10b981; /* Emerald */
            --success-glow: rgba(16, 185, 129, 0.2);
            
            --warning: #f59e0b; /* Amber - for missed steps */
            --warning-glow: rgba(245, 158, 11, 0.2);
            
            --text-primary: #f8fafc;
            --text-secondary: #a1a1aa;
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --font-sans: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Lock the body, allow inner panels to scroll */
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden; /* Critical for fixed layout */
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.1) 0%, transparent 50%);
        }

        /* 3-Column Premium Layout */
        .app-container {
            width: 100%; max-width: 1600px; height: 96vh;
            display: flex; gap: 20px; padding: 20px;
        }

        .panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* ================= LEFT PANEL (HUD) ================= */
        .panel-left { width: 320px; padding: 24px; flex-shrink: 0; }

        .brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
            margin-bottom: 40px; color: #fff;
        }
        /* Sleek Audio Wave SVG Logo */
        .brand svg {
            width: 32px; height: 32px;
            fill: none; stroke: var(--accent-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .status-card {
            background: linear-gradient(145deg, var(--surface-100), var(--bg-base));
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 24px; text-align: center;
        }
        .ai-status-indicator {
            width: 12px; height: 12px; border-radius: 50%; background: #52525b;
            display: inline-block; margin-right: 8px; transition: all 0.3s ease;
        }
        .ai-status-indicator.listening {
            background: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-primary), 0 0 24px var(--accent-primary);
            animation: pulse 1.5s infinite;
        }
        .status-text { font-size: 14px; font-weight: 500; color: var(--text-secondary); }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 12px;
        }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #4f46e5; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-primary.active { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background: var(--surface-200); }

        .console-feed {
            flex: 1; background: #000; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 16px; font-family: monospace; font-size: 12px; color: var(--text-secondary);
            overflow-y: auto; margin-top: 12px; line-height: 1.6;
        }
        .console-feed span.match { color: var(--success); }
        .console-feed span.miss { color: var(--warning); }

        /* ================= MIDDLE PANEL (SCRIPT) ================= */
        .panel-middle { flex: 1; position: relative; }

        .panel-header {
            padding: 24px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(10px); z-index: 10;
        }
        .panel-header h2 { font-size: 18px; font-weight: 600; }

        select.task-dropdown {
            background: var(--surface-200); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 8px 16px; border-radius: var(--radius-sm);
            font-size: 14px; font-family: var(--font-sans); outline: none; cursor: pointer;
        }

        .script-scroll {
            padding: 32px 40px; overflow-y: auto; flex: 1; scroll-behavior: smooth;
        }

        .script-block {
            padding: 24px; margin-bottom: 24px; border-radius: var(--radius-md);
            background: var(--surface-100); border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        /* States */
        .script-block.active {
            border-color: var(--accent-primary); border-left: 4px solid var(--accent-primary);
            background: rgba(99, 102, 241, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateX(4px);
        }
        .script-block.done {
            border-left-color: var(--success); opacity: 0.6;
        }
        .script-block.missed {
            border-left-color: var(--warning); border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.05);
        }

        .script-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 12px; display: flex; justify-content: space-between;
            color: var(--text-secondary);
        }
        .script-block.active .script-title { color: var(--accent-primary); }
        .script-block.done .script-title { color: var(--success); text-decoration: line-through; }
        .script-block.missed .script-title { color: var(--warning); }
        .script-block.missed .script-title::after { content: 'MISSED STEP'; background: var(--warning); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        .script-text { font-size: 16px; line-height: 1.7; color: var(--text-primary); }
        .keyword-highlight { font-weight: 600; color: #fff; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }

        /* Consent Card inside Script */
        .consent-ui {
            margin-top: 16px; padding: 16px; background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
        }
        .consent-btns { display: flex; gap: 12px; margin-top: 12px; }
        .consent-btns button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 13px;}
        .btn-yes { background: var(--success); color: #000; }
        .btn-no { background: var(--border-color); color: #fff; }
        #guideModeText { display: none; margin-top: 12px; font-size: 14px; color: var(--text-secondary); border-left: 2px solid var(--border-color); padding-left: 12px;}

        /* ================= RIGHT PANEL (CHECKLIST) ================= */
        .panel-right { width: 340px; flex-shrink: 0; }
        
        .qa-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .qa-header h3 { font-size: 16px; font-weight: 600; }
        
        .qa-scroll { padding: 24px; overflow-y: auto; flex: 1; }

        .qa-item {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            background: var(--surface-100); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); margin-bottom: 10px; transition: all 0.3s;
        }
        
        /* Checkbox Styling */
        .qa-checkbox {
            width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .qa-checkbox svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
        
        /* State Updates for Checklist */
        .qa-item.done { border-color: var(--success); background: var(--success-glow); }
        .qa-item.done .qa-checkbox { background: var(--success); border-color: var(--success); }
        .qa-item.done .qa-checkbox svg { opacity: 1; transform: scale(1); }
        .qa-item.done .qa-title { color: var(--success); text-decoration: line-through; }

        .qa-item.missed { border-color: var(--warning); background: var(--warning-glow); }
        .qa-item.missed .qa-checkbox { background: var(--warning); border-color: var(--warning); }
        .qa-item.missed .qa-checkbox svg { opacity: 1; transform: scale(1); stroke: #000; } /* Checked but orange */
        .qa-item.missed .qa-title { color: var(--warning); }

        .qa-title { font-size: 13px; font-weight: 500; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ================= 1. LEFT PANEL ================= -->
        <div class="panel panel-left">
            <div class="brand">
                <svg viewBox="0 0 24 24"><path d="M12 2L12 22M6 8L6 16M18 8L18 16M3 11L3 13M21 11L21 13"/></svg>
                Techsoul Assist
            </div>

            <div class="status-card">
                <div style="margin-bottom: 12px;">
                    <span class="ai-status-indicator" id="statusDot"></span>
                    <span class="status-text" id="statusText">System Idle</span>
                </div>
                <div style="font-size: 32px; font-weight: 700; color: #fff;" id="progressScore">0%</div>
                <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">QA Score</div>
            </div>

            <button class="btn btn-primary" id="micBtn" onclick="toggleListening()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                <span id="micBtnText">Initialize AI Listener</span>
            </button>
            <button class="btn btn-outline" onclick="alert('Copying to clipboard...')">
                Export CRM Notes
            </button>

            <div class="console-feed" id="consoleOutput">
                > System ready.<br>
                > Awaiting voice stream...<br>
            </div>
        </div>

        <!-- ================= 2. MIDDLE PANEL ================= -->
        <div class="panel panel-middle">
            <div class="panel-header">
                <h2>Verbiage Guide</h2>
                <select class="task-dropdown" id="taskSelect" onchange="updateTaskType()">
                    <option value="ads">Task: Ads Conversion Tracking</option>
                    <option value="ga4">Task: GA4 Setup & Linking</option>
                    <option value="consent">Task: Consent Mode V2</option>
                </select>
            </div>

            <div class="script-scroll" id="scriptScrollArea">
                <!-- Dynamically generated via JS to keep HTML clean -->
                <div id="scriptContainer"></div>
            </div>
        </div>

        <!-- ================= 3. RIGHT PANEL ================= -->
        <div class="panel panel-right">
            <div class="qa-header">
                <h3>Live Flow Tracker</h3>
            </div>
            <div class="qa-scroll" id="qaScrollArea">
                <!-- Dynamically generated via JS -->
                <div id="qaContainer"></div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. CORE DATA & STATE ---
        // 'status' can be: 'pending', 'active', 'done', 'missed'
        let scriptData = [
            { id: 'intro', title: '1. Greeting', keywords: ['technical solutions', 'on behalf of google', 'how are you doing'], status: 'active', text: `"Hi! My name is <span class="keyword-highlight">[Your Name]</span>, and I'm calling from the Technical Solutions team on behalf of Google. Am I speaking with <span class="keyword-highlight">[Advertiser Name]</span>? How are you doing today?"` },
            { id: 'rec', title: '2. Recorded Line', keywords: ['recorded or monitored', 'privacy policy'], status: 'pending', text: `"This call may be recorded or monitored for quality, training and to improve Google's services, subject to our Privacy Policy. Do you agree to have this call monitored and recorded?"` },
            { id: 'auth', title: '3. Authentication', keywords: ['10 digit', 'customer id', 'email address', 'website name'], status: 'pending', text: `"To ensure that we're working on the correct account, please confirm your <span class="keyword-highlight">10-digit Customer ID</span> along with your <span class="keyword-highlight">email address</span> and your <span class="keyword-highlight">website name</span>?"` },
            { id: 'task', title: '4. Task & Access', keywords: ['ads conversion tracking', 'admin access', 'backup'], status: 'pending', text: `"This request was submitted for the <span class="keyword-highlight">Ads Conversion Tracking</span>. Please confirm if you have admin access to your Google Ads account and to the admin panel of the website? Could you please confirm if a backup of the website was taken recently?"` },
            { id: 'share', title: '5. Screen Share', keywords: ['close all your private', 'confidential windows', 'present now', 'entire screen'], status: 'pending', text: `"Before sharing your screen Please, close all your private/confidential windows, tabs and documents. When you are ready, please click 'Present now' and choose 'Entire screen'."` },
            { id: 'pa_pitch', title: '6. PA Pitch', keywords: ['implementation from our end', 'temporary access', 'guiding you through'], status: 'pending', text: `"We may proceed with the implementation from our end or by guiding you through each step. To proceed with the creation on your behalf, we would need to ask you for temporary access. Do you agree?"`, isConsent: true },
            { id: 'sum', title: '7. Summarize Call', keywords: ['discussed and implemented', 'tags are firing'], status: 'pending', text: `"During our interaction, we discussed and implemented the tags. We also verified that they are firing correctly. Any user coming through a google ad click will now be tracked."` },
            { id: 'close', title: '8. Test & Close', keywords: ['test conversion', 'close the case'], status: 'pending', text: `"The implementation is complete. Our quality team may perform a test conversion to validate. Can I go ahead and close the case?"` },
            { id: 'gcss', title: '9. GCSS Feedback', keywords: ['feedback email', 'continued partnership'], status: 'pending', text: `"We will be sending you a feedback email once your current case is closed. We appreciate your continued partnership with Google. Have a great day!"` }
        ];

        // --- 2. DYNAMIC RENDERING ---
        function renderUI() {
            const scriptContainer = document.getElementById('scriptContainer');
            const qaContainer = document.getElementById('qaContainer');
            scriptContainer.innerHTML = ''; qaContainer.innerHTML = '';

            scriptData.forEach((item, index) => {
                // Script Block
                let blockHTML = `
                    <div class="script-block ${item.status}" id="script-${item.id}">
                        <div class="script-title"><span>${item.title}</span></div>
                        <div class="script-text">${item.text}</div>`;
                
                if (item.isConsent) {
                    blockHTML += `
                        <div class="consent-ui">
                            <div style="font-size: 12px; color: var(--text-secondary);">Did advertiser consent to PA Access?</div>
                            <div class="consent-btns">
                                <button class="btn-yes" onclick="handleConsent(true, ${index})">YES (Launch Session)</button>
                                <button class="btn-no" onclick="handleConsent(false, ${index})">NO (Guide Mode)</button>
                            </div>
                            <div id="guideModeText">"Thank you, we understand your concerns. In that case we will navigate you through the implementation process step-by-step."</div>
                        </div>`;
                }
                blockHTML += `</div>`;
                scriptContainer.innerHTML += blockHTML;

                // QA Checklist Item
                let checkedClass = (item.status === 'done' || item.status === 'missed') ? 'done' : '';
                if(item.status === 'missed') checkedClass = 'missed';

                qaContainer.innerHTML += `
                    <div class="qa-item ${checkedClass}" id="qa-${item.id}">
                        <div class="qa-checkbox">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <div class="qa-title">${item.title}</div>
                    </div>`;
            });

            updateProgress();
            scrollToActive();
        }

        function updateTaskType() {
            const type = document.getElementById('taskSelect').value;
            if(type === 'ads') {
                scriptData[3].text = `"This request was submitted for the <span class="keyword-highlight">Ads Conversion Tracking</span>. Please confirm if you have admin access..."`;
                scriptData[3].keywords = ['ads conversion tracking', 'admin access', 'backup'];
            } else if (type === 'ga4') {
                scriptData[3].text = `"This request was submitted for the <span class="keyword-highlight">GA4 Setup and Linking</span>. Please confirm if you have admin access to the Analytics property..."`;
                scriptData[3].keywords = ['ga4 setup', 'analytics property', 'admin access'];
            } else if (type === 'consent') {
                scriptData[3].text = `"This request was submitted for <span class="keyword-highlight">Consent Mode V2</span>. Please confirm if your banner provider is a certified CMP..."`;
                scriptData[3].keywords = ['consent mode', 'certified cmp', 'banner provider'];
            }
            logMsg(`Task updated to ${type.toUpperCase()}`);
            renderUI();
        }

        function handleConsent(isYes, index) {
            if(isYes) {
                window.open('https://tagsupport.corp.google.com/create-session', '_blank');
            } else {
                document.getElementById('guideModeText').style.display = 'block';
            }
            markStepDone(index);
        }

        // --- 3. UI BEHAVIORS ---
        function updateProgress() {
            let completed = scriptData.filter(i => i.status === 'done' || i.status === 'missed').length;
            let percent = Math.round((completed / scriptData.length) * 100);
            document.getElementById('progressScore').innerText = `${percent}%`;
        }

        function scrollToActive() {
            // Find first active or missed block to keep it in view
            let target = scriptData.find(i => i.status === 'active') || scriptData.find(i => i.status === 'missed');
            if (target) {
                let el = document.getElementById(`script-${target.id}`);
                if (el) {
                    const scrollArea = document.getElementById('scriptScrollArea');
                    const rect = el.getBoundingClientRect();
                    const areaRect = scrollArea.getBoundingClientRect();
                    
                    // Only scroll if element is not fully visible
                    if (rect.top < areaRect.top || rect.bottom > areaRect.bottom) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        }

        const consoleFeed = document.getElementById('consoleOutput');
        function logMsg(msg, type = 'normal') {
            let colorClass = '';
            if(type === 'match') colorClass = 'match';
            if(type === 'miss') colorClass = 'miss';
            
            consoleFeed.innerHTML += `> <span class="${colorClass}">${msg}</span><br>`;
            consoleFeed.scrollTop = consoleFeed.scrollHeight;
        }

        // --- 4. ADVANCED AI LISTENER LOGIC ---
        let recognition;
        let isSystemListening = false;
        let isIntentionalStop = true; // To prevent auto-restart when user clicks stop

        function initVoiceEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRec) {
                logMsg('FATAL: Speech API not supported in this browser. Use Chrome.', 'miss');
                return null;
            }
            
            let rec = new SpeechRec();
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
                isSystemListening = true;
                document.getElementById('statusDot').classList.add('listening');
                document.getElementById('statusText').innerText = 'Decoding Voice...';
                logMsg('Mic active. Processing stream...');
            };

            rec.onresult = (e) => {
                let finalTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
                }
                
                if (finalTranscript.trim() !== '') {
                    analyzeTranscript(finalTranscript.toLowerCase());
                }
            };

            // AGGRESSIVE KEEP-ALIVE LOOP
            rec.onend = () => {
                isSystemListening = false;
                document.getElementById('statusDot').classList.remove('listening');
                
                if (!isIntentionalStop) {
                    document.getElementById('statusText').innerText = 'Re-engaging...';
                    // 100ms debounce to prevent callstack overflow
                    setTimeout(() => {
                        try { rec.start(); } catch(err) { console.error(err); }
                    }, 100);
                } else {
                    document.getElementById('statusText').innerText = 'System Idle';
                }
            };

            rec.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    isIntentionalStop = true;
                    toggleListeningState(false);
                    logMsg('ERROR: Microphone permission denied.', 'miss');
                }
            };

            return rec;
        }

        function toggleListening() {
            if(!recognition) recognition = initVoiceEngine();
            if(!recognition) return;

            if (isIntentionalStop) {
                // START
                isIntentionalStop = false;
                toggleListeningState(true);
                try { recognition.start(); } catch(e){}
            } else {
                // STOP
                isIntentionalStop = true;
                toggleListeningState(false);
                recognition.stop();
                logMsg('System offline.');
            }
        }

        function toggleListeningState(isActive) {
            const btn = document.getElementById('micBtn');
            if (isActive) {
                btn.classList.add('active');
                document.getElementById('micBtnText').innerText = 'Deactivate AI';
            } else {
                btn.classList.remove('active');
                document.getElementById('micBtnText').innerText = 'Initialize AI Listener';
            }
        }

        // --- 5. MISSED-STEP DETECTION ENGINE ---
        function analyzeTranscript(text) {
            // Find the highest step number mentioned in this phrase
            let highestMatchIndex = -1;

            scriptData.forEach((step, index) => {
                if (step.status === 'pending' || step.status === 'active') {
                    let matchFound = step.keywords.some(kw => text.includes(kw.toLowerCase()));
                    if (matchFound) {
                        highestMatchIndex = Math.max(highestMatchIndex, index);
                    }
                }
            });

            if (highestMatchIndex !== -1) {
                markStepDone(highestMatchIndex);
            }
        }

        function markStepDone(matchedIndex) {
            let stateChanged = false;

            // 1. Mark all pending steps BEFORE the matched index as MISSED
            for (let i = 0; i < matchedIndex; i++) {
                if (scriptData[i].status === 'pending' || scriptData[i].status === 'active') {
                    scriptData[i].status = 'missed';
                    logMsg(`WARNING: Skipped "${scriptData[i].title}"`, 'miss');
                    stateChanged = true;
                }
            }

            // 2. Mark the matched step as DONE
            if (scriptData[matchedIndex].status !== 'done') {
                scriptData[matchedIndex].status = 'done';
                logMsg(`CHECK: "${scriptData[matchedIndex].title}" confirmed.`, 'match');
                stateChanged = true;
            }

            // 3. Set the NEXT available step to ACTIVE
            let nextIndex = matchedIndex + 1;
            if (nextIndex < scriptData.length && scriptData[nextIndex].status === 'pending') {
                scriptData[nextIndex].status = 'active';
                stateChanged = true;
            }

            if (stateChanged) renderUI();
        }

        // Initialize UI
        renderUI();
    </script>
</body>
</html>
